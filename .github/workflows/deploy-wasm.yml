name: Build and Deploy Freegemas Browser Site

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'media/**'
      - 'wasm/**'
      - 'x16/**'
      - 'vera/freegemas.hdv'
      - 'web/**'
      - '.github/workflows/deploy-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Verify Emscripten
        run: emcc --version

      - name: Build native WebAssembly player
        run: |
          chmod +x wasm/build.sh
          wasm/build.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Commander X16 browser player
        run: node x16/web/build.mjs

      - name: Assemble landing page and players
        run: node web/build-site.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
